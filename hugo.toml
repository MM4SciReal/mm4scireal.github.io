# GitHub Pages の Organization サイト（リポジトリ名を mm4scireal.github.io にする）。
# サブパスなしのルート公開のため baseURL は末尾スラッシュのみ。
baseURL = 'https://mm4scireal.github.io/'
locale = 'en-us'
title = 'MM4SciReal: Multimodal AI for Science and the Real World @ ACCV 2026'
theme = 'PaperMod'

enableInlineShortcodes = true
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
enableEmoji = true

# 記事分類を使わないため、中身が空の /categories/ と /tags/ を出力しない。
disableKinds = ['taxonomy', 'term']

[pagination]
pagerSize = 10

[outputs]
home = ['HTML', 'RSS', 'JSON']

[markup.goldmark.renderer]
unsafe = true

#######################################
# PaperMod パラメータ
#######################################
[params]
env = 'production'
title = 'MM4SciReal: Multimodal AI for Science and the Real World @ ACCV 2026'
description = 'MM4SciReal: Multimodal AI for Science and the Real World, Workshop at ACCV 2026.'
keywords = ['MM4SciReal', 'ACCV 2026', 'Multimodal AI', 'AI for Science', 'Vision-Language Models', 'Computer Vision', 'Workshop']
DateFormat = 'January 2, 2006'
defaultTheme = 'auto'
disableThemeToggle = false
ShowReadingTime = false
ShowShareButtons = false
ShowPostNavLinks = false
ShowBreadCrumbs = false
ShowCodeCopyButtons = false
ShowWordCount = false
ShowToc = false
hideMeta = true
ShowFullTextinRSS = false
mainSections = ['news']

[params.label]
text = 'MM4SciReal @ ACCV 2026'

#######################################
# OGP 画像
# PaperMod の og:image / twitter:image は .Params.cover.image しか見ず、
# site params にフォールバックしないため cascade で全ページに配る。
# hidden = true はページ本文側のカバー画像表示だけを止める（メタタグには影響しない）。
#######################################
[[cascade]]
[cascade.cover]
image = '/images/og.jpg'
alt = 'MM4SciReal: Multimodal AI for Science and the Real World @ ACCV 2026'
hidden = true

[params.assets]
disableHLJS = true
disableFingerprinting = false

# Google Search Console の所有権確認用メタタグ。
[params.analytics.google]
SiteVerificationTag = 'ucdQM-YOL8jHp0dRvQNIjsXg46e6s5CnP8iT_9vipeQ'

#######################################
# schema.org Event 構造化データ（トップページのみ出力）
# Google の Event リッチリザルトは startDate が必須のため、
# 開催日が確定するまで startDate は空にしておく（空なら JSON-LD 自体を出力しない）。
# 日程確定後に startDate / endDate を 'YYYY-MM-DD' で埋めれば自動で出力される。
#######################################
[params.event]
startDate = ''
endDate = ''
venue = 'ACCV 2026'
locality = 'Osaka'
region = 'Osaka'
country = 'JP'

[[params.socialIcons]]
name = 'email'
title = 'Contact the organizers'
url = 'mailto:mm4scireal@googlegroups.com'

#######################################
# ナビゲーションメニュー
#######################################
[[menu.main]]
identifier = 'home'
name = 'Home'
url = '/'
weight = 10

[[menu.main]]
identifier = 'cfp'
name = 'Call for Papers'
url = '/call-for-papers/'
weight = 20

[[menu.main]]
identifier = 'program'
name = 'Program'
url = '/program/'
weight = 30

[[menu.main]]
identifier = 'speakers'
name = 'Speakers'
url = '/speakers/'
weight = 40

[[menu.main]]
identifier = 'organizers'
name = 'Organizers'
url = '/organizers/'
weight = 50
