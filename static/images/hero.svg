<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Abstract multimodal AI background">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="0.5" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.18" r="0.7">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="600" fill="url(#bg)"/>
  <rect width="1600" height="600" fill="url(#glow)"/>

  <circle cx="1250" cy="130" r="130" fill="#ffffff" fill-opacity="0.05"/>
  <circle cx="1430" cy="430" r="200" fill="#22d3ee" fill-opacity="0.06"/>

  <!-- node network (multimodal motif) -->
  <g stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5">
    <line x1="1180" y1="90"  x2="1320" y2="160"/>
    <line x1="1320" y1="160" x2="1450" y2="100"/>
    <line x1="1320" y1="160" x2="1250" y2="250"/>
    <line x1="1250" y1="250" x2="1400" y2="300"/>
    <line x1="1450" y1="100" x2="1520" y2="220"/>
    <line x1="1400" y1="300" x2="1520" y2="220"/>
    <line x1="1080" y1="200" x2="1180" y2="90"/>
    <line x1="1250" y1="250" x2="1180" y2="360"/>
    <line x1="1080" y1="200" x2="1180" y2="360"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.55">
    <circle cx="1180" cy="90"  r="7"/>
    <circle cx="1320" cy="160" r="9"/>
    <circle cx="1450" cy="100" r="7"/>
    <circle cx="1250" cy="250" r="8"/>
    <circle cx="1400" cy="300" r="7"/>
    <circle cx="1520" cy="220" r="6"/>
    <circle cx="1080" cy="200" r="6"/>
    <circle cx="1180" cy="360" r="7"/>
  </g>
</svg>
